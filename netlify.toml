[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = ["templates/**", "static/**", "indian_cities.py", "config.py", "database.py", "data_fetcher.py", "utils.py", "app.py"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
